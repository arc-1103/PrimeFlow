services:
  app:
    build:
      context: .
      args:
        EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./corpus:/srv/corpus
      - ./data:/srv/data
      - ./indexes:/srv/indexes
